query Input {
  cart {
    lines {
      id
      quantity
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            bundleComponents: metafield(namespace: "custom", key: "bundle_components") {
              value
            }
            bundleDiscount: metafield(namespace: "custom", key: "bundle_discount") {
              value
            }
          }
        }
      }
    }
  }
}