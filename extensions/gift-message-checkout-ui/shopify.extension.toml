# Learn more about configuring your checkout UI extension:
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/configuration

# The version of APIs your extension will receive. Learn more:
# https://shopify.dev/docs/api/usage/versioning
api_version = "2026-10"

[[extensions]]
name = "gift-message-checkout-ui"
handle = "gift-message-checkout-ui"
type = "ui_extension"
uid = "792faa6f-5ea0-7380-3097-80f10f9fc96896bbc7f8"

[[extensions.targeting]]
module = "./src/Checkout.jsx"
target = "purchase.checkout.block.render"

[extensions.capabilities]
api_access = true

[extensions.settings]
[[extensions.settings.fields]]
key = "gift_variant_id"
type = "single_line_text_field"
name = "Gift Variant GID (Required)"

[[extensions.settings.fields]]
key = "custom_heading"
type = "single_line_text_field"
name = "Banner Heading"
description = "Text for the top of the banner. Defaults to 'Free Gift Eligible!'"

[[extensions.settings.fields]]
key = "extra_description"
type = "multi_line_text_field"
name = "Additional Description"
description = "Optional extra text to display below the product description in subdued grey."